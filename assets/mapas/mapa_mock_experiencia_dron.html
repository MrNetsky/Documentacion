<!DOCTYPE html>
<html>
<head>
    <title>Mapa Mock - Experiencia Dron Mesh</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .legend {
            background: white;
            padding: 10px;
            border: 2px solid grey;
            border-radius: 5px;
            line-height: 1.5;
            font-family: sans-serif;
            font-size: 13px;
        }
        .legend i {
            width: 12px;
            height: 12px;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-31.81155, -64.401515], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marcadores
        var jdq = L.marker([-31.8019, -64.4131]).addTo(map)
            .bindPopup('<b>José de la Quintana</b><br>Oficina / punto de partida');
        
        var si = L.marker([-31.8212, -64.38993]).addTo(map)
            .bindPopup('<b>San Isidro</b><br>Casa de Pablo / destino');

        // Línea de ruta mock
        var route = L.polyline(
            [[-31.8019, -64.4131], [-31.8212, -64.38993]],
            {color: 'blue', weight: 4, opacity: 0.7}
        ).addTo(map).bindPopup('Ruta mock: oficina → casa de Pablo');

        // Círculos de cobertura
        L.circle([-31.8019, -64.4131], {
            radius: 2000, color: 'green', fillColor: 'green', fillOpacity: 0.1
        }).addTo(map).bindPopup('Cobertura mesh aprox. (2km)');

        L.circle([-31.8212, -64.38993], {
            radius: 2000, color: 'red', fillColor: 'red', fillOpacity: 0.1
        }).addTo(map).bindPopup('Cobertura mesh aprox. (2km)');

        // Leyenda
        var legend = L.control({position: 'bottomleft'});
        legend.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>Leyenda</b><br>' +
                '<span style="color:green">●</span> José de la Quintana (inicio)<br>' +
                '<span style="color:red">●</span> San Isidro (destino)<br>' +
                '<span style="color:blue">━</span> Ruta de prueba<br>' +
                '<span style="color:grey">○</span> Cobertura mesh aprox.';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
